name: FastSaver Low Credits Alert Check (10k Threshold)

on:
  schedule:
    # Periodically checks FastSaver API balance and only sends a Telegram message if credits <= 10,000
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  check-fastsaver-credits:
    runs-on: ubuntu-latest
    steps:
      - name: Check FastSaver API Credits (Alert only if <= 10k)
        run: |
          echo "Checking FastSaver API balance (alerts Telegram only when credits <= 10,000)..."
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" "https://www.yt4mp3.com/api/fastsaver-balance-check")
          BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
          STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')
          echo "Response Status: $STATUS"
          echo "Response Body: $BODY"
          if [ "$STATUS" -ne 200 ]; then
            echo "Endpoint returned non-200 status: $STATUS"
            exit 1
          fi
